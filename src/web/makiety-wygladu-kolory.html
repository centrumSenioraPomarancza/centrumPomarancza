<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Makiety wyglądu: kolory — Centrum Seniora Pomarańcza</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="js/makiety-palety.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; color: #1f2937; background: #f3f4f6; line-height: 1.6; }
    header { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1rem 1.5rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: #2f3640; margin-bottom: .5rem; }
    header p { color: #6b7280; max-width: 720px; margin-bottom: 1.25rem; }
    .wstecz { display: inline-block; color: #ea580c; text-decoration: none; font-weight: 500; font-size: .9rem; margin-bottom: 1rem; }
    .wstecz:hover { text-decoration: underline; }
    /* zakładki: wybór układu A / B / C */
    .zakladki { display: flex; gap: .5rem; flex-wrap: wrap; }
    .zakladki button { font: inherit; font-weight: 600; cursor: pointer; padding: .65rem 1.2rem; border-radius: 999px; border: 2px solid #e5e7eb; background: #fff; color: #2f3640; }
    .zakladki button:hover { border-color: #fdba74; }
    .zakladki button.on { background: #ea580c; border-color: #ea580c; color: #fff; }
    main {
      max-width: 1200px; margin: 0 auto; padding: 0 1rem 3rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 1.5rem;
    }
    @media (max-width: 600px) { main { grid-template-columns: 1fr; } }
    .makieta { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
    .makieta-head { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .makieta-name { font-weight: 600; font-size: 1.05rem; color: #2f3640; }
    .makieta-link { font-size: .82rem; color: #ea580c; white-space: nowrap; text-decoration: none; font-weight: 500; }
    .makieta-link:hover { text-decoration: underline; }
    .swatches { display: flex; gap: .4rem; padding: 0 1.25rem 1rem; flex-wrap: wrap; }
    .swatch { display: flex; flex-direction: column; align-items: center; gap: .2rem; font-size: .68rem; color: #6b7280; }
    .swatch span { width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(0,0,0,.08); }
    /* podgląd strony: 1280×860 pomniejszone do szerokości karty */
    .podglad { position: relative; width: 100%; aspect-ratio: 1280 / 860; overflow: hidden; border-top: 1px solid #e5e7eb; }
    .podglad iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 860px; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>

<header>
  <a class="wstecz" href="makiety-wygladu2.html">← Wszystkie układy</a>
  <h1>Makiety wyglądu: kolory</h1>
  <p>Każdy z trzech układów w kilku paletach. Wybierz układ, a poniżej zobaczysz go w każdej palecie, każdą na osobnej karcie. Pomarańcz zostaje głównym akcentem, zmieniają się kolory towarzyszące. Podglądy można przewijać.</p>
  <div class="zakladki" id="zakladki"></div>
</header>

<main id="makiety"></main>

<script>
  const UKLADY = [
    { id: 'magazyn', litera: 'A', nazwa: 'Magazyn' },
    { id: 'kafle',   litera: 'B', nazwa: 'Duże kafle' },
    { id: 'mozaika', litera: 'C', nazwa: 'Mozaika' },
  ];
  const ETYKIETY = ['akcent', 'ciemny', 'tło', 'nagłówki'];

  const zakladki = document.getElementById('zakladki');
  const main = document.getElementById('makiety');

  function pokaz(id) {
    const uklad = UKLADY.find(u => u.id === id) || UKLADY[0];
    zakladki.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === uklad.id));
    history.replaceState(null, '', '?uklad=' + uklad.id);
    main.innerHTML = '';
    Object.entries(PALETY_MAKIET).forEach(([motyw, p]) => {
      const url = `makieta-uklad-${uklad.id}.html` + (motyw === 'domyslny' ? '' : '?motyw=' + motyw);
      const el = document.createElement('section');
      el.className = 'makieta';
      el.innerHTML = `
        <div class="makieta-head">
          <div class="makieta-name">${uklad.litera} · ${uklad.nazwa} — ${p.nazwa}</div>
          <a class="makieta-link" href="${url}" target="_blank" rel="noopener">Otwórz pełną stronę ↗</a>
        </div>
        <div class="swatches">
          ${[p.orange, p.orangeDk, p.bg, p.heading].map((k, i) => `<div class="swatch"><span style="background:${k}"></span>${ETYKIETY[i]}</div>`).join('')}
        </div>
        <div class="podglad"><iframe src="${url}" title="Podgląd: ${uklad.nazwa}, ${p.nazwa}" loading="lazy"></iframe></div>`;
      main.appendChild(el);
    });
    skaluj();
  }

  UKLADY.forEach(u => {
    const b = document.createElement('button');
    b.dataset.id = u.id;
    b.textContent = `${u.litera} · ${u.nazwa}`;
    b.onclick = () => pokaz(u.id);
    zakladki.appendChild(b);
  });

  function skaluj() {
    document.querySelectorAll('.podglad').forEach(p => {
      p.querySelector('iframe').style.transform = `scale(${p.clientWidth / 1280})`;
    });
  }
  window.addEventListener('resize', skaluj);
  pokaz(new URLSearchParams(location.search).get('uklad'));
</script>
</body>
</html>
